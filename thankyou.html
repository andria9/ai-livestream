<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Pembayaran Berhasil | PreneurMastery</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .card {
      background: #020617;
      border-radius: 16px;
      max-width: 520px;
      width: 90%;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #22d3ee;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 20px;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #22d3ee, #0ea5e9);
      color: #020617;
      padding: 14px 30px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: 0.3s;
      margin-top: 10px;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34,211,238,0.4);
    }

    .info {
      margin-top: 25px;
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 15px;
    }

    .brand {
      margin-top: 15px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🎉</div>

    <h1>Pembayaran Berhasil!</h1>

    <p>
      Terima kasih telah melakukan pembelian.<br>
      Akses produk AI Livestream kamu sudah aktif.
    </p>

    <a 
      href="https://drive.google.com/file/d/1XOCXwWjTLo9OTu9AlvLyGyOlhaMuoUrB/view?usp=drivesdk"
      target="_blank"
      class="download-btn"
    >
      ⬇ Download Sekarang
    </a>

    <div class="info">
      Jika tombol tidak berfungsi, salin link berikut:
      <br><br>
      <small>
        https://drive.google.com/file/d/1XOCXwWjTLo9OTu9AlvLyGyOlhaMuoUrB/view
      </small>
    </div>

    <div class="brand">
      © 2026 PreneurMastery • All Rights Reserved
    </div>

  </div>

</body>
</html>
